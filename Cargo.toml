[package]
name = "codecrafters-redis"
version = "0.1.0"
authors = ["Codecrafters <hello@codecrafters.io>"]
edition = "2024"

[dependencies]
anyhow = "1.0.100"
bytes = "1.10.1"
clap = { version = "4.5.50", features = ["derive"] }
hex = "0.4.3"
radix_trie = "0.3.0"
rand = "0.9.2"
tokio = { version = "1.47.1", features = ["io-util", "macros", "rt-multi-thread", "time", "sync", "net"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"

[dev-dependencies]
chrono = "0.4.42"
redis = { version = "0.32.7", features = ["tokio-comp"] }
tracing-subscriber = {version = "0.3.20", features = ["env-filter"] }
